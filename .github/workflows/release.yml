name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check and run full test suite
        run: bun run verify

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - bun-linux-x64-modern
          - bun-linux-arm64
          - bun-darwin-x64-modern
          - bun-darwin-arm64
          - bun-windows-x64-modern
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (${{ matrix.target }})
        run: bun scripts/build.ts --target ${{ matrix.target }}
      - name: Rename binary for release
        run: |
          case "${{ matrix.target }}" in
            *windows*)   mv build/pico.exe build/pico-windows-x64.exe ;;
            *linux-x64*) mv build/pico build/pico-linux-x64 ;;
            *linux-arm64*) mv build/pico build/pico-linux-arm64 ;;
            *darwin-x64*) mv build/pico build/pico-darwin-x64 ;;
            *darwin-arm64*) mv build/pico build/pico-darwin-arm64 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.target }}
          path: build/pico*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes