<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" rx="24" fill="#1a1a2e"/>

  <!-- ===== Pixel Pet "Byte" ===== -->
  <!-- Retro pixel-style robot creature -->
  <g transform="translate(200, 210)">
    <!-- Glow aura -->
    <circle cx="0" cy="0" r="100" fill="#a78bfa" opacity="0.04"/>
    <circle cx="0" cy="0" r="75" fill="#a78bfa" opacity="0.06"/>

    <!-- Body - single rounded rect (like a Game Boy) -->
    <rect x="-55" y="20" width="110" height="90" rx="18" fill="#22223a" stroke="#a78bfa" stroke-width="2.5"/>

    <!-- Body screen -->
    <rect x="-40" y="30" width="80" height="40" rx="6" fill="#1a1a2e" stroke="#6b6b7a" stroke-width="1"/>

    <!-- Screen content: pulsing heart beat -->
    <path d="M-30 50 L-22 50 L-18 44 L-12 56 L-8 48 L-2 58 L2 46 L8 50 L15 50"
          stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Body buttons -->
    <circle cx="-25" cy="85" r="5" fill="#DE7356"/>
    <circle cx="-10" cy="85" r="5" fill="#6b6b7a"/>
    <circle cx="5" cy="85" r="5" fill="#6b6b7a"/>
    <circle cx="20" cy="85" r="5" fill="#6b6b7a"/>

    <!-- D-pad cross -->
    <rect x="30" y="78" width="6" height="18" rx="2" fill="#6b6b7a"/>
    <rect x="27" y="84" width="12" height="6" rx="2" fill="#6b6b7a"/>

    <!-- Head - large round single eye -->
    <circle cx="0" cy="-30" r="38" fill="#2a2a45" stroke="#a78bfa" stroke-width="2.5"/>

    <!-- Single large eye (like a cute robot) -->
    <ellipse cx="0" cy="-30" rx="20" ry="18" fill="#1a1a2e" stroke="#6b6b7a" stroke-width="1.5"/>
    <!-- Eye - terminal cursor blink -->
    <rect x="-6" y="-40" width="12" height="20" rx="3" fill="#a78bfa"/>
    <!-- Eye highlight -->
    <circle cx="-3" cy="-44" r="5" fill="#e8e4e0" opacity="0.3"/>

    <!-- Little ears / antenna nubs -->
    <circle cx="-38" cy="-30" r="8" fill="#DE7356"/>
    <circle cx="38" cy="-30" r="8" fill="#DE7356"/>

    <!-- Ears inner -->
    <circle cx="-38" cy="-30" r="4" fill="#1a1a2e"/>
    <circle cx="38" cy="-30" r="4" fill="#1a1a2e"/>

    <!-- Little smile -->
    <path d="M-10 -16 Q0 -8 10 -16" stroke="#DE7356" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Tiny arms -->
    <rect x="-70" y="30" width="15" height="8" rx="4" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="55" y="30" width="15" height="8" rx="4" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>

    <!-- Feet -->
    <rect x="-28" y="106" width="24" height="10" rx="5" fill="#22223a" stroke="#DE7356" stroke-width="1.5"/>
    <rect x="4" y="106" width="24" height="10" rx="5" fill="#22223a" stroke="#DE7356" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="418" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Menlo',monospace" font-size="38" font-weight="600" fill="#e8e4e0" letter-spacing="3">
    src<tspan fill="#DE7356">o</tspan>de
  </text>
  <text x="200" y="443" text-anchor="middle" font-family="'JetBrains Mono','Menlo',monospace" font-size="11" fill="#6b6b7a" letter-spacing="4">
    "BYTE"
  </text>
  <rect x="155" y="454" width="90" height="3" rx="1.5" fill="#a78bfa" opacity="0.3"/>
</svg>