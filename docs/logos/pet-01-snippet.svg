<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" rx="24" fill="#1a1a2e"/>

  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a45" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="250" rx="160" ry="180" fill="url(#bgGlow)"/>

  <!-- ===== Robo-Cat "Snippet" ===== -->
  <g transform="translate(200, 240)">
    <!-- Body -->
    <rect x="-50" y="10" width="100" height="80" rx="16" fill="#22223a" stroke="#a78bfa" stroke-width="2.5"/>
    <!-- Body detail: code line -->
    <line x1="-30" y1="35" x2="30" y2="35" stroke="#6b6b7a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="50" x2="20" y2="50" stroke="#6b6b7a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-28" y1="65" x2="28" y2="65" stroke="#6b6b7a" stroke-width="2" stroke-linecap="round"/>

    <!-- Head -->
    <rect x="-45" y="-60" width="90" height="75" rx="14" fill="#2a2a45" stroke="#a78bfa" stroke-width="2.5"/>

    <!-- Ears - cat triangle ears -->
    <polygon points="-38,-60 -52,-95 -24,-60" fill="#DE7356" stroke="#DE7356" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="38,-60 52,-95 24,-60" fill="#DE7356" stroke="#DE7356" stroke-width="2" stroke-linejoin="round"/>

    <!-- Inner ears -->
    <polygon points="-36,-63 -47,-88 -27,-63" fill="#1a1a2e"/>
    <polygon points="36,-63 47,-88 27,-63" fill="#1a1a2e"/>

    <!-- Eyes - terminal cursor style -->
    <rect x="-26" y="-40" width="14" height="18" rx="3" fill="#a78bfa"/>
    <rect x="12" y="-40" width="14" height="18" rx="3" fill="#a78bfa"/>
    <!-- Eye glow -->
    <rect x="-24" y="-38" width="8" height="10" rx="2" fill="#c4b5fd" opacity="0.6"/>
    <rect x="14" y="-38" width="8" height="10" rx="2" fill="#c4b5fd" opacity="0.6"/>

    <!-- Nose -->
    <circle cx="0" cy="-28" r="3" fill="#DE7356"/>

    <!-- Mouth - code brackets -->
    <text x="0" y="-16" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#6b6b7a">&lt;/&gt;</text>

    <!-- Whiskers - code paths -->
    <line x1="-46" y1="-30" x2="-65" y2="-35" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="-46" y1="-25" x2="-65" y2="-22" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="46" y1="-30" x2="65" y2="-35" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <line x1="46" y1="-25" x2="65" y2="-22" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

    <!-- Antenna -->
    <line x1="0" y1="-60" x2="0" y2="-80" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-85" r="6" fill="#DE7356"/>
    <!-- Antenna signal arcs -->
    <path d="M-10 -92 Q0 -100 10 -92" stroke="#DE7356" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M-15 -97 Q0 -108 15 -97" stroke="#DE7356" stroke-width="1" fill="none" opacity="0.25"/>

    <!-- Arms -->
    <rect x="-70" y="20" width="20" height="8" rx="4" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="50" y="20" width="20" height="8" rx="4" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>

    <!-- Legs -->
    <rect x="-30" y="86" width="22" height="12" rx="6" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="8" y="86" width="22" height="12" rx="6" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>

    <!-- Tail - curly brace shape -->
    <path d="M50 80 Q70 80 70 60 Q70 40 55 40 Q45 40 45 50 Q45 55 50 55"
          stroke="#DE7356" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="420" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Menlo',monospace" font-size="38" font-weight="600" fill="#e8e4e0" letter-spacing="3">
    <tspan fill="#a78bfa">s</tspan>rcode
  </text>
  <text x="200" y="445" text-anchor="middle" font-family="'JetBrains Mono','Menlo',monospace" font-size="11" fill="#6b6b7a" letter-spacing="4">
    "SNIPPET"
  </text>
  <rect x="155" y="456" width="90" height="3" rx="1.5" fill="#a78bfa" opacity="0.3"/>
</svg>