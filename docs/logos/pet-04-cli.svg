<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" rx="24" fill="#1a1a2e"/>

  <defs>
    <filter id="glow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===== Terminal Pet "CLI" ===== -->
  <g transform="translate(200, 230)">
    <!-- Body - terminal window shape -->
    <rect x="-55" y="25" width="110" height="85" rx="10" fill="#22223a" stroke="#a78bfa" stroke-width="2"/>

    <!-- Window title bar -->
    <rect x="-55" y="25" width="110" height="18" rx="10" fill="#a78bfa" opacity="0.15"/>
    <rect x="-55" y="35" width="110" height="8" fill="#a78bfa" opacity="0.15"/>

    <!-- Window dots -->
    <circle cx="-40" cy="34" r="3.5" fill="#DE7356"/>
    <circle cx="-28" cy="34" r="3.5" fill="#6b6b7a" opacity="0.5"/>
    <circle cx="-16" cy="34" r="3.5" fill="#6b6b7a" opacity="0.5"/>

    <!-- Window title -->
    <text x="30" y="38" text-anchor="end" font-family="monospace" font-size="8" fill="#6b6b7a">srcode</text>

    <!-- Terminal content lines -->
    <text x="-40" y="58" font-family="monospace" font-size="9" fill="#a78bfa">$</text>
    <text x="-33" y="58" font-family="monospace" font-size="9" fill="#e8e4e0" opacity="0.7">vibe &amp; code</text>
    <text x="-40" y="74" font-family="monospace" font-size="9" fill="#a78bfa">$</text>
    <text x="-33" y="74" font-family="monospace" font-size="9" fill="#e8e4e0" opacity="0.7">src --memory</text>

    <!-- Blinking cursor -->
    <rect x="14" y="65" width="2" height="11" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Head - terminal >_ prompt shape -->
    <path d="M-35 -45 L35 -45 L45 -30 L35 -15 L-35 -15 L-45 -30 Z"
          fill="#2a2a45" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Face screen -->
    <rect x="-30" y="-40" width="60" height="22" rx="5" fill="#1a1a2e" stroke="#6b6b7a" stroke-width="1"/>

    <!-- Eyes: > < style (like a cute anime face using brackets) -->
    <text x="-10" y="-25" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" fill="#a78bfa" font-weight="bold">&gt;</text>
    <text x="14" y="-25" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" fill="#a78bfa" font-weight="bold">&lt;</text>

    <!-- Blush -->
    <ellipse cx="-22" cy="-18" rx="8" ry="4" fill="#DE7356" opacity="0.2"/>
    <ellipse cx="22" cy="-18" rx="8" ry="4" fill="#DE7356" opacity="0.2"/>

    <!-- Mouth: underscore smile -->
    <text x="0" y="-10" text-anchor="middle" font-family="monospace" font-size="10" fill="#DE7356">_</text>

    <!-- Horn antenna (single) -->
    <path d="M0 -45 L0 -60" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-65" r="5" fill="#DE7356" filter="url(#glow4)"/>

    <!-- Arms - like [] brackets -->
    <text x="-66" y="55" font-family="'Courier New',monospace" font-size="28" fill="#DE7356" opacity="0.6" font-weight="bold">[</text>
    <text x="54" y="55" font-family="'Courier New',monospace" font-size="28" fill="#DE7356" opacity="0.6" font-weight="bold">]</text>

    <!-- Little legs -->
    <rect x="-22" y="106" width="18" height="10" rx="4" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="4" y="106" width="18" height="10" rx="4" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="418" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Menlo',monospace" font-size="38" font-weight="600" fill="#e8e4e0" letter-spacing="3">
    <tspan fill="#a78bfa">src</tspan>ode
  </text>
  <text x="200" y="443" text-anchor="middle" font-family="'JetBrains Mono','Menlo',monospace" font-size="11" fill="#6b6b7a" letter-spacing="4">
    "CLI"
  </text>
  <rect x="155" y="454" width="90" height="3" rx="1.5" fill="#DE7356" opacity="0.4"/>
</svg>