<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" rx="24" fill="#1a1a2e"/>

  <defs>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a45" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="230" rx="170" ry="160" fill="url(#glow2)"/>

  <!-- ===== Robo-Dog "Source" ===== -->
  <g transform="translate(200, 230)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="55" ry="40" fill="#22223a" stroke="#a78bfa" stroke-width="2.5"/>
    <!-- Body panel -->
    <rect x="-30" y="20" width="60" height="35" rx="8" fill="#1a1a2e" stroke="#6b6b7a" stroke-width="1" opacity="0.8"/>
    <!-- Heart indicator on chest -->
    <text x="0" y="42" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#DE7356">&lt;3</text>

    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="40" ry="35" fill="#2a2a45" stroke="#a78bfa" stroke-width="2.5"/>

    <!-- Floppy dog ears - code bracket shapes -->
    <path d="M-35 -35 Q-55 -45 -50 -20 Q-48 -10 -40 -10" fill="#22223a" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <path d="M35 -35 Q55 -45 50 -20 Q48 -10 40 -10" fill="#22223a" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

    <!-- Screen/visor face -->
    <rect x="-28" y="-42" width="56" height="30" rx="8" fill="#1a1a2e" stroke="#6b6b7a" stroke-width="1.5"/>

    <!-- Eyes - blinking cursor eyes -->
    <rect x="-18" y="-36" width="10" height="12" rx="2" fill="#a78bfa"/>
    <rect x="8" y="-36" width="10" height="12" rx="2" fill="#a78bfa"/>
    <!-- Eye glow -->
    <rect x="-16" y="-34" width="5" height="6" rx="1.5" fill="#e8e4e0" opacity="0.5"/>
    <rect x="10" y="-34" width="5" height="6" rx="1.5" fill="#e8e4e0" opacity="0.5"/>

    <!-- Nose -->
    <ellipse cx="0" cy="-20" rx="5" ry="3" fill="#DE7356"/>

    <!-- Happy mouth -->
    <path d="M-8 -15 Q0 -10 8 -15" stroke="#6b6b7a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Tongue sticking out - terminal prompt -->
    <rect x="-3" y="-13" width="6" height="8" rx="2" fill="#DE7356" opacity="0.7"/>
    <text x="0" y="-7" text-anchor="middle" font-family="monospace" font-size="6" fill="#1a1a2e">$</text>

    <!-- Top antenna with status dot -->
    <line x1="0" y1="-65" x2="0" y2="-82" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-6" y="-88" width="12" height="8" rx="2" fill="#a78bfa"/>

    <!-- Front paws - like command buttons -->
    <rect x="-35" y="75" width="24" height="10" rx="5" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="11" y="75" width="24" height="10" rx="5" fill="#22223a" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- Paw buttons -->
    <circle cx="-23" cy="80" r="3" fill="#DE7356"/>
    <circle cx="23" cy="80" r="3" fill="#DE7356"/>

    <!-- Tail - like a curly brace spring -->
    <path d="M50 30 Q80 20 75 -5 Q70 -25 55 -15"
          stroke="#DE7356" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="415" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Menlo',monospace" font-size="38" font-weight="600" fill="#e8e4e0" letter-spacing="3">
    src<tspan fill="#a78bfa">ode</tspan>
  </text>
  <text x="200" y="440" text-anchor="middle" font-family="'JetBrains Mono','Menlo',monospace" font-size="11" fill="#6b6b7a" letter-spacing="4">
    "SOURCE"
  </text>
  <rect x="155" y="451" width="90" height="3" rx="1.5" fill="#DE7356" opacity="0.3"/>
</svg>