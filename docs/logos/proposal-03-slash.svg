<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" rx="24" fill="#1a1a2e"/>

  <!-- Source directory + code icon -->
  <g transform="translate(200, 190)">
    <!-- Folder icon -->
    <path d="M-60 -40 L-20 -40 L-5 -25 L55 -25"
          stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-60 -40 C-60 -48 -52 -55 -44 -55 L-24 -55 C-16 -55 -8 -48 -5 -40 L55 -40 C63 -40 70 -33 70 -25 L70 35 C70 43 63 50 55 50 L-55 50 C-63 50 -70 43 -70 35 L-70 -40"
          stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Inside folder: "src" path -->
    <text x="0" y="-5" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="14" fill="#DE7356" font-weight="500">
      src/
    </text>

    <!-- Code cursor indicator -->
    <rect x="28" y="-14" width="2" height="16" fill="#a78bfa" opacity="0.7"/>

    <!-- Code brackets inside folder -->
    <text x="0" y="35" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="22" fill="#6b6b7a" opacity="0.5">
      {  ·  }
    </text>
  </g>

  <!-- Wordmark: src/ode with highlight -->
  <text x="200" y="340" text-anchor="middle" font-family="'SF Mono','JetBrains Mono','Fira Code','Menlo',monospace" font-size="44" font-weight="600" letter-spacing="3">
    <tspan fill="#a78bfa">src</tspan><tspan fill="#e8e4e0">ode</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="370" text-anchor="middle" font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#6b6b7a" letter-spacing="4">
    AGENT · MEMORY · CODE
  </text>
</svg>